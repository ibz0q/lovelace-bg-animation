version: v1
metadata:
  name: Flow Gradient
  description: |
    Animated gradient blobs with Perlin flow field distortion, Voronoi displacement, Gaussian blur and film grain. Extracted from apollostudio.design.
  author: Apollo Studio (extracted)
  tags:
    - gradient
    - webgl
    - animated
    - abstract
config:
  - name: gradientColors
    default:
      - "#8BFFFF"
      - "#D9FF43"
      - "#EB73A0"
      - "#320072"
      - "#0156B9"
    description: Array of gradient colors (2–8 colors).
    type: array
    behavior: environment
  - name: gradientSpeed
    default: 0.16
    description: Speed of the gradient scroll animation. Higher = faster.
    type: number
    behavior: environment
  - name: blobColor1
    default: "#4AAEFF"
    description: Color of the first blob (blended with ADD).
    type: string
    behavior: environment
  - name: blobColor2
    default: "#FF2EBE"
    description: Color of the second blob (blended with OVERLAY).
    type: string
    behavior: environment
  - name: flowSpeed
    default: 0.25
    description: Speed of the Perlin flow field animation.
    type: number
    behavior: environment
  - name: flowStrength
    default: 1.81
    description: Strength of the flow field distortion (0 = no distortion).
    type: number
    behavior: environment
  - name: blurAmount
    default: 3.62
    description: Gaussian blur radius. Higher = softer, dreamier look.
    type: number
    behavior: environment
  - name: voronoiStrength
    default: 0.91
    description: Voronoi displacement strength. Higher = more cell-like warping.
    type: number
    behavior: environment
  - name: grainAmount
    default: 0.36
    description: Film grain intensity (0–1).
    type: number
    behavior: environment
  - name: backgroundColor
    default: "#000000"
    description: Background color shown behind the effect.
    type: string
    behavior: environment
template: >
  <!DOCTYPE html>
  <html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
    (function() {

      // ── Config ──────────────────────────────────────────────────────────────
      const cfg = {
        gradientColors: window.env?.gradientColors || ["#8BFFFF","#D9FF43","#EB73A0","#320072","#0156B9"],
        gradientSpeed:  window.env?.gradientSpeed  ?? 0.16,
        blobColor1:     window.env?.blobColor1     || "#4AAEFF",
        blobColor2:     window.env?.blobColor2     || "#FF2EBE",
        flowSpeed:      window.env?.flowSpeed      ?? 0.25,
        flowStrength:   window.env?.flowStrength   ?? 1.81,
        blurAmount:     window.env?.blurAmount     ?? 3.62,
        voronoiStrength:window.env?.voronoiStrength?? 0.91,
        grainAmount:    window.env?.grainAmount    ?? 0.36,
        backgroundColor:window.env?.backgroundColor|| "#000000",
      };

      function hexToVec3(hex) {
        const r = parseInt(hex.slice(1,3),16)/255;
        const g = parseInt(hex.slice(3,5),16)/255;
        const b = parseInt(hex.slice(5,7),16)/255;
        return [r, g, b];
      }

      // ── WebGL setup ─────────────────────────────────────────────────────────
      const canvas = document.getElementById('c');
      const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
      if (!gl) { document.body.style.background = cfg.backgroundColor; return; }

      let W, H;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = Math.floor(canvas.clientWidth  * dpr);
        H = Math.floor(canvas.clientHeight * dpr);
        canvas.width  = W;
        canvas.height = H;
        gl.viewport(0, 0, W, H);
        rebuildFBOs();
      }

      // ── Shader helpers ──────────────────────────────────────────────────────
      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
          console.error(gl.getShaderInfoLog(s), src.slice(0,200));
        return s;
      }
      function link(vs, fs) {
        const p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER,   vs));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(p);
        return p;
      }
      function use(prog) {
        gl.useProgram(prog);
        return {
          uni1f:(n,v)=>gl.uniform1f(gl.getUniformLocation(prog,n),v),
          uni2f:(n,a,b)=>gl.uniform2f(gl.getUniformLocation(prog,n),a,b),
          uni3f:(n,a,b,c)=>gl.uniform3f(gl.getUniformLocation(prog,n),a,b,c),
          uni1i:(n,v)=>gl.uniform1i(gl.getUniformLocation(prog,n),v),
          uniArr:(n,a)=>{const l=gl.getUniformLocation(prog,n);if(l!=null)gl.uniform3fv(l,a);},
        };
      }

      // Full-screen quad
      const QUAD_VS = `#version 300 es
        in vec2 aPos;
        out vec2 vUV;
        void main(){vUV=(aPos+1.)*.5;gl_Position=vec4(aPos,0,1);}
      `;
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

      function bindQuad(prog) {
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        const loc = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      }

      // ── Framebuffers ────────────────────────────────────────────────────────
      let fbos = [];
      function makeFBO(w, h) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { fb, tex };
      }
      function rebuildFBOs() {
        fbos.forEach(f=>{ gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); });
        fbos = Array.from({length: 4}, ()=> makeFBO(W, H));
      }
      function renderToFBO(fbo) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo ? fbo.fb : null);
        gl.viewport(0, 0, W, H);
      }
      function bindTex(unit, tex) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, tex);
      }

      // ── Programs ────────────────────────────────────────────────────────────

      // 1. GRADIENT — animated horizontal gradient with oklab mixing
      const gradProg = link(QUAD_VS, `#version 300 es
        precision highp float;
        in vec2 vUV;
        uniform float uTime;
        uniform float uSpeed;
        uniform int uNumColors;
        uniform vec3 uColors[8];
        out vec4 fragColor;

        vec3 linear_from_srgb(vec3 c){return pow(c,vec3(2.2));}
        vec3 srgb_from_linear(vec3 c){return pow(c,vec3(1./2.2));}
        const mat3 kCONEtoLMS=mat3(0.4121656120,0.2118591070,0.0883097947,0.5362752080,0.6807189584,0.2818474174,0.0514575653,0.1074065790,0.6302613616);
        const mat3 kLMStoCONE=mat3(4.0767245293,-1.2681437731,-0.0041119885,-3.3072168827,2.6093323231,-0.7034763098,0.2307590544,-0.3411344290,1.7068625689);
        vec3 oklab_mix(vec3 a,vec3 b,float t){
          vec3 lms1=pow(kCONEtoLMS*a,vec3(1./3.));
          vec3 lms2=pow(kCONEtoLMS*b,vec3(1./3.));
          vec3 lms=mix(lms1,lms2,t);
          lms*=1.+0.025*t*(1.-t);
          return kLMStoCONE*(lms*lms*lms);
        }
        vec3 gradientColor(float p){
          p=clamp(p,0.,1.);
          int n=uNumColors;
          for(int i=0;i<n-1;i++){
            float a=float(i)/float(n-1);
            float b=float(i+1)/float(n-1);
            if(p<=b){
              float t=(p-a)/(b-a);
              return srgb_from_linear(oklab_mix(linear_from_srgb(uColors[i]),linear_from_srgb(uColors[i+1]),t));
            }
          }
          return uColors[n-1];
        }
        float rand(vec2 co){return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);}
        void main(){
          float pos=vUV.x-(uTime*0.01*uSpeed+0.22);
          float cycle=floor(pos);
          bool rev=int(cycle)%2==0;
          float ap=rev?1.-fract(pos):fract(pos);
          vec3 col=gradientColor(ap);
          col+=rand(gl_FragCoord.xy)*0.005;
          fragColor=vec4(col,1.);
        }
      `);

      // 2. BLOB — renders a soft circle/ellipse into a texture
      const blobProg = link(QUAD_VS, `#version 300 es
        precision highp float;
        in vec2 vUV;
        uniform vec3 uColor;
        uniform vec2 uCenter;   // 0..1
        uniform float uRadius;  // 0..1 relative
        uniform float uAspect;
        out vec4 fragColor;
        void main(){
          vec2 uv=vUV;
          vec2 d=(uv-uCenter)*vec2(uAspect,1.);
          float dist=length(d)/uRadius;
          float alpha=smoothstep(1.,0.1,dist);
          fragColor=vec4(uColor*alpha,alpha);
        }
      `);

      // 3. COMPOSITE — alpha blend / ADD / OVERLAY onto existing
      const compositeProg = link(QUAD_VS, `#version 300 es
        precision highp float;
        in vec2 vUV;
        uniform sampler2D uBase;
        uniform sampler2D uLayer;
        uniform int uMode; // 0=normal,1=add,2=overlay
        out vec4 fragColor;
        vec3 overlayBlend(vec3 s,vec3 d){
          return vec3(
            d.r<=.5?2.*s.r*d.r:1.-2.*(1.-d.r)*(1.-s.r),
            d.g<=.5?2.*s.g*d.g:1.-2.*(1.-d.g)*(1.-s.g),
            d.b<=.5?2.*s.b*d.b:1.-2.*(1.-d.b)*(1.-s.b)
          );
        }
        void main(){
          vec4 base=texture(uBase,vUV);
          vec4 layer=texture(uLayer,vUV);
          vec3 result;
          if(uMode==1){ // ADD
            result=base.rgb+layer.rgb*layer.a;
          } else if(uMode==2){ // OVERLAY
            result=overlayBlend(layer.rgb,base.rgb)*layer.a+base.rgb*(1.-layer.a);
          } else { // NORMAL
            result=mix(base.rgb,layer.rgb,layer.a);
          }
          fragColor=vec4(result,1.);
        }
      `);

      // 4. BLUR — separable Gaussian (horizontal + vertical pass)
      const blurProg = link(QUAD_VS, `#version 300 es
        precision highp float;
        in vec2 vUV;
        uniform sampler2D uTex;
        uniform vec2 uResolution;
        uniform vec2 uDirection;
        uniform float uAmount;
        uniform vec2 uFocusPos;
        out vec4 fragColor;
        float rand(vec2 s){return fract(sin(dot(s,vec2(12.9898,78.233)))*43758.5453);}
        void main(){
          vec2 uv=vUV;
          float inner=distance(uv,uFocusPos);
          float outer=max(0.,1.-distance(uv,uFocusPos));
          float amount=(uAmount*6.)*.001*mix(inner,outer,0.87);
          vec4 col=vec4(0.);
          float wSum=0.;
          for(int i=-18;i<=18;i++){
            float x=float(i);
            // Gaussian weight approx
            float w=exp(-x*x/(2.*18.*18./9.));
            col+=texture(uTex,uv+uDirection*x*amount)*w;
            wSum+=w;
          }
          col/=wSum;
          col.rgb+=((rand(gl_FragCoord.xy)-0.5)/255.);
          fragColor=col;
        }
      `);

      // 5. FLOW FIELD — Perlin noise UV warp
      const flowProg = link(QUAD_VS, `#version 300 es
        precision mediump float;
        in vec2 vUV;
        uniform sampler2D uTex;
        uniform float uTime;
        uniform float uSpeed;
        uniform float uStrength;
        uniform vec2 uResolution;
        out vec4 fragColor;

        vec3 hash33(vec3 p){
          p=fract(p*vec3(0.1031,0.11369,0.13787));
          p+=dot(p,p.yxz+19.19);
          return -1.+2.*fract(vec3((p.x+p.y)*p.z,(p.x+p.z)*p.y,(p.y+p.z)*p.x));
        }
        float perlin(vec3 p){
          vec3 pi=floor(p),pf=p-pi;
          vec3 w=pf*pf*(3.-2.*pf);
          float n000=dot(pf-vec3(0,0,0),hash33(pi+vec3(0,0,0)));
          float n100=dot(pf-vec3(1,0,0),hash33(pi+vec3(1,0,0)));
          float n010=dot(pf-vec3(0,1,0),hash33(pi+vec3(0,1,0)));
          float n110=dot(pf-vec3(1,1,0),hash33(pi+vec3(1,1,0)));
          float n001=dot(pf-vec3(0,0,1),hash33(pi+vec3(0,0,1)));
          float n101=dot(pf-vec3(1,0,1),hash33(pi+vec3(1,0,1)));
          float n011=dot(pf-vec3(0,1,1),hash33(pi+vec3(0,1,1)));
          float n111=dot(pf-vec3(1,1,1),hash33(pi+vec3(1,1,1)));
          float nx00=mix(n000,n100,w.x),nx01=mix(n001,n101,w.x);
          float nx10=mix(n010,n110,w.x),nx11=mix(n011,n111,w.x);
          return mix(mix(nx00,nx10,w.y),mix(nx01,nx11,w.y),w.z);
        }
        vec2 flow(vec2 st){
          float ar=uResolution.x/uResolution.y;
          vec2 focusPos=vec2(0.711,0.526);
          float dist=max(0.,1.-distance(st*vec2(ar,1.),focusPos*vec2(ar,1.))*4.);
          float amt=uStrength*0.01*dist;
          if(amt<=0.) return st;
          float sprd=(0.39)/((ar+1.)/2.);
          for(float i=0.;i<16.;i++){
            vec2 scaled=(st-.5)*vec2(ar,1.)+(1.-focusPos);
            float p=perlin(vec3((scaled-.5)*(5.*sprd),32.67*5.+uTime*uSpeed/60.))-0.5;
            float ang=p*(360.*0.9)*3.14159/180.;
            st+=vec2(cos(ang),sin(ang))*amt;
            st=clamp(st,0.,1.);
          }
          return st;
        }
        void main(){
          vec2 uv=flow(vUV);
          fragColor=texture(uTex,uv);
        }
      `);

      // 6. VORONOI displacement
      const voronoiProg = link(QUAD_VS, `#version 300 es
        precision mediump float;
        in vec2 vUV;
        uniform sampler2D uTex;
        uniform float uTime;
        uniform float uStrength;
        uniform vec2 uResolution;
        out vec4 fragColor;
        vec2 rand2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
        const float PI=3.14159265359;
        mat2 rot(float a){return mat2(cos(a),-sin(a),sin(a),cos(a));}
        void main(){
          vec2 uv=vUV;
          float ar=uResolution.x/uResolution.y;
          vec2 skew=mix(vec2(1.),vec2(1.,0.),0.71);
          vec2 st=(uv-vec2(.5))*vec2(ar,1.)*164.;
          st=st*rot(0.75*2.*PI)*skew;
          vec2 i_st=floor(st),f_st=fract(st);
          float mDist=15.; vec2 mPoint;
          for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
            vec2 nb=vec2(float(i),float(j));
            vec2 pt=rand2(i_st+nb);
            pt=.5+.5*sin(5.+uTime*.2+6.2831*pt);
            float d=length(nb+pt-f_st);
            if(d<mDist){mDist=d;mPoint=pt;}
          }
          vec2 offset=(mPoint*0.2*uStrength*2.)-(uStrength*0.2);
          float dist=max(0.,1.-distance(uv*vec2(ar,1.),vec2(.5)*vec2(ar,1.))*4.*.9);
          fragColor=texture(uTex,uv+offset*dist);
        }
      `);

      // 7. GRAIN
      const grainProg = link(QUAD_VS, `#version 300 es
        precision mediump float;
        in vec2 vUV;
        uniform sampler2D uTex;
        uniform float uTime;
        uniform float uAmount;
        uniform vec2 uResolution;
        out vec4 fragColor;
        const float PHI=1.61803398874989484820459;
        float gold_noise(vec2 xy,float seed){return fract(tan(distance(xy*PHI,xy)*seed)*xy.x);}
        vec3 overlay(vec3 s,vec3 d){
          return vec3(
            d.r<=.5?2.*s.r*d.r:1.-2.*(1.-d.r)*(1.-s.r),
            d.g<=.5?2.*s.g*d.g:1.-2.*(1.-d.g)*(1.-s.g),
            d.b<=.5?2.*s.b*d.b:1.-2.*(1.-d.b)*(1.-s.b)
          );
        }
        void main(){
          vec2 uv=vUV;
          vec4 color=texture(uTex,uv);
          vec2 st=uv*uResolution;
          float delta=fract(floor(uTime)/20.);
          vec3 grain=vec3(gold_noise(st,delta+1.),gold_noise(st,delta+2.),gold_noise(st,delta+3.));
          color.rgb=mix(color.rgb,overlay(grain,color.rgb),uAmount);
          fragColor=color;
        }
      `);

      // ── Bind quad once per program after resize ─────────────────────────────
      [gradProg, blobProg, compositeProg, blurProg, flowProg, voronoiProg, grainProg]
        .forEach(p => bindQuad(p));

      // ── Render ───────────────────────────────────────────────────────────────
      let t0 = performance.now();

      function draw() {
        const uTime = (performance.now() - t0) / 1000;
        const ar = W / H;
        const bgCol = hexToVec3(cfg.backgroundColor);
        const colors = cfg.gradientColors.slice(0, 8).map(hexToVec3);
        const numColors = colors.length;
        const flatColors = colors.flat();

        // Pad to 8 colors
        while (flatColors.length < 24) flatColors.push(0, 0, 0);

        // FBO aliases
        const [fboA, fboB, fboC, fboD] = fbos;

        // ── Pass 1: Draw gradient into fboA ──────────────────────────────────
        renderToFBO(fboA);
        const gu = use(gradProg);
        bindQuad(gradProg);
        gu.uni1f('uTime', uTime * cfg.gradientSpeed * 60);
        gu.uni1f('uSpeed', cfg.gradientSpeed);
        gu.uni1i('uNumColors', numColors);
        gl.uniform3fv(gl.getUniformLocation(gradProg, 'uColors'), new Float32Array(flatColors));
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // ── Pass 2: Render blob1 into fboB ───────────────────────────────────
        renderToFBO(fboB);
        gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
        const bu = use(blobProg);
        bindQuad(blobProg);
        const b1 = hexToVec3(cfg.blobColor1);
        bu.uni3f('uColor', b1[0], b1[1], b1[2]);
        bu.uni2f('uCenter', 0.75, 0.3);
        bu.uni1f('uRadius', 0.55);
        bu.uni1f('uAspect', ar);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // Composite blob1 (ADD) onto fboA → fboC
        renderToFBO(fboC);
        const cu = use(compositeProg);
        bindQuad(compositeProg);
        bindTex(0, fboA.tex); cu.uni1i('uBase', 0);
        bindTex(1, fboB.tex); cu.uni1i('uLayer', 1);
        cu.uni1i('uMode', 1); // ADD
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // ── Pass 3: Render blob2 into fboB ───────────────────────────────────
        renderToFBO(fboB);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const b2 = hexToVec3(cfg.blobColor2);
        bu.uni3f('uColor', b2[0], b2[1], b2[2]);
        bu.uni2f('uCenter', 0.78, 0.9);
        bu.uni1f('uRadius', 0.55);
        bu.uni1f('uAspect', ar);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // Composite blob2 (OVERLAY) onto fboC → fboA
        renderToFBO(fboA);
        bindTex(0, fboC.tex); cu.uni1i('uBase', 0);
        bindTex(1, fboB.tex); cu.uni1i('uLayer', 1);
        cu.uni1i('uMode', 2); // OVERLAY
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // ── Pass 4: Gaussian blur H onto fboB, then V onto fboC ──────────────
        const blru = use(blurProg);
        bindQuad(blurProg);
        blru.uni2f('uResolution', W, H);
        blru.uni2f('uFocusPos', -0.712, 0.367);
        blru.uni1f('uAmount', cfg.blurAmount);

        renderToFBO(fboB);
        bindTex(0, fboA.tex); blru.uni1i('uTex', 0);
        blru.uni2f('uDirection', 1.0, 0.0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        renderToFBO(fboC);
        bindTex(0, fboB.tex); blru.uni1i('uTex', 0);
        blru.uni2f('uDirection', 0.0, ar);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // ── Pass 5: Flow field onto fboA ──────────────────────────────────────
        renderToFBO(fboA);
        const flu = use(flowProg);
        bindQuad(flowProg);
        bindTex(0, fboC.tex); flu.uni1i('uTex', 0);
        flu.uni1f('uTime', uTime * cfg.flowSpeed * 60);
        flu.uni1f('uSpeed', cfg.flowSpeed);
        flu.uni1f('uStrength', cfg.flowStrength);
        flu.uni2f('uResolution', W, H);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // ── Pass 6: Voronoi displacement (×2) → fboB, then fboC ──────────────
        const vou = use(voronoiProg);
        bindQuad(voronoiProg);
        vou.uni1f('uTime', uTime);
        vou.uni1f('uStrength', cfg.voronoiStrength);
        vou.uni2f('uResolution', W, H);

        renderToFBO(fboB);
        bindTex(0, fboA.tex); vou.uni1i('uTex', 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        renderToFBO(fboC);
        bindTex(0, fboB.tex); vou.uni1i('uTex', 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        // ── Pass 7: Film grain → screen ───────────────────────────────────────
        renderToFBO(null);
        const gru = use(grainProg);
        bindQuad(grainProg);
        bindTex(0, fboC.tex); gru.uni1i('uTex', 0);
        gru.uni1f('uTime', uTime);
        gru.uni1f('uAmount', cfg.grainAmount);
        gru.uni2f('uResolution', W, H);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);
    })();
    </script>
  </body>
  </html>
